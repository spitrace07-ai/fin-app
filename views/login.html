<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinTrust Bank</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js"></script>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <div class="brand">
                <span>FinTrust</span> Bank
            </div>
            <a href="/" class="btn btn-outline">Back to Home</a>
        </div>
    </nav>

    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="glass-card" style="width: 100%; max-width: 450px;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 2rem;">Welcome Back</h2>
                <p style="color: var(--text-muted);">Secure Login to your personal account</p>
            </div>

            <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.1); color: var(--error); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 0.9rem; text-align: center;">
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Account Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Authorize Access</button>
            </form>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                <p>Forgot password? Contact your regional manager.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    errorDiv.textContent = result.message || 'Authentication Failed';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error("Login Error", err);
            }
        });
    </script>
</body>
</html>
